[project]
name = "auditoria"
version = "0.1.0"
description = "Worker de auditoria fiscal (somente leitura): ingestão, motor de regras e relatórios"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "psycopg[binary]>=3.2",
    "lxml>=5.2",
    "pandas>=2.2",
    "openpyxl>=3.1",
    "xlrd>=2.0.1",
    "weasyprint==70.0",
    "anthropic>=0.40",
    "httpx>=0.28.1",
    "python-multipart>=0.0.32",
    "olefile>=0.47",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/auditoria"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.coverage.run]
source = ["src/auditoria"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.File", "fastapi.Form"]

[tool.ruff.lint.per-file-ignores]
"src/auditoria/reports.py" = ["E501"]  # template HTML/CSS

"src/auditoria/report_design.py" = ["E501"]  # template HTML/CSS
